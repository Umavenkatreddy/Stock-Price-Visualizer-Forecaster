name: AI PR Review (GitHub Models)

# Posts a Claude-style code review on every pull request, free, using
# GitHub Models. Complements `ci-failure-agent.yml` which only runs after CI
# fails — this one fires on every PR open / push so reviewers get an instant
# AI second-pair-of-eyes regardless of test outcome.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read           # required to call GitHub Models inference

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest

    # Skip PRs from forks — their tokens are read-only and can't post comments.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: Compute PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Cap at 150 KB to stay well within model context.
          git diff --no-color "$BASE_SHA"..."$HEAD_SHA" \
            -- ':(exclude)**/*.lock' ':(exclude)**/*.png' \
               ':(exclude)**/*.jpg' ':(exclude)**/*.jpeg' \
               ':(exclude)**/*.gif' ':(exclude)**/*.pdf' \
               ':(exclude)**/*.svg' \
            | head -c 150000 > pr.diff
          echo "diff bytes: $(wc -c < pr.diff)"

      - name: Run AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'openai/gpt-4o-mini' }}
        run: python .github/scripts/ai_review.py